
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>IPL 2026 Ticket Booking</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#matches">Matches</a></li>
                <li><a href="booking.html">Book Ticket</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Ticket Booking Form</h2>

            <form action="#" method="get">

                <!-- Name -->
                <p>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    minlength="3" maxlength="30" required>
                </p>

                <!-- Email -->
                <p>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    maxlength="254"
                    required>
                </p>

                <!-- Phone -->
                <p>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone"
                    placeholder="Enter 10 digit number"
                    autocomplete="tel"
                    pattern="[0-9]{10}"
                    minlength="10" maxlength="10"
                    required>
                </p>

                <!-- Match Selection -->
                <p>
                    <label for="match">Select Match:</label>
                    <select id="match" name="match" required>
                        <option value="">Choose Match</option>
                        <option value="RCB vs MI">RCB vs MI</option>
                        <option value="CSK vs KKR">CSK vs KKR</option>
                        <option value="DC vs SRH">DC vs SRH</option>
                    </select>
                </p>

                <!-- Stand Category -->
                <p>
                    <label for="stand">Stand Category:</label>
                    <select id="stand" name="stand" required>
                        <option value="">Select Stand</option>
                        <option value="General">General - Rs.1500</option>
                        <option value="Premium">Premium - Rs.3500</option>
                        <option value="VIP">VIP - Rs.7500</option>
                    </select>
                </p>

                <!-- Number of Tickets -->
                <p>
                    <label for="quantity">Number of Tickets:</label>
                    <input type="number" id="quantity" name="quantity"
                    min="1" max="10"
                    placeholder="Enter ticket quantity"
                    required>
                </p>

                <!-- Additional Preference -->
                <fieldset>
                    <legend>Additional Preferences</legend>
                    <p>
                        <input type="radio" id="food" name="preference"
                        value="Food">
                        <label for="food">Food preference</label>
                    </p>
                    <p>
                        <input type="radio" id="parking" name="preference"
                        value="Parking">
                        <label for="parking">Parking required</label>
                    </p>
                </fieldset>

                <!-- Terms -->
                <p>
                    <input type="checkbox" id="terms"
                    name="terms" required>
                    <label for="terms">
                        I agree to the booking terms and conditions.
                    </label>
                </p>

                <!-- Buttons -->
                <button type="submit">Submit Booking</button>

                <button type="reset">Reset Form</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All rights reserved.</p>
    </footer>

    <script>
        document.querySelector("form").addEventListener("submit", (event) => {
            event.preventDefault();
            alert("Booking successful! Your tickets have been booked.");
        });
    </script>
</body>
</html>
